name: FIRSTMOD .exe Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Yayınla (self-contained, tek dosya, win-x64)
        run: dotnet publish FIRSTMOD.csproj -c Release -r win-x64

      - name: FIRSTMOD.exe'yi hazırla
        run: |
          mkdir out
          copy bin\Release\net8.0-windows\win-x64\publish\FIRSTMOD.exe out\FIRSTMOD.exe

      - name: .exe dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: FIRSTMOD-exe
          path: out\FIRSTMOD.exe
